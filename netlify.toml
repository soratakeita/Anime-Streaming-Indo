# netlify.toml

# Sitemap dinamis (harus sebelum SPA redirect)
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

# Redirect untuk API ke Netlify Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# Redirect untuk image proxy ke Netlify Function
[[redirects]]
  from = "/img-proxy"
  to = "/.netlify/functions/img-proxy"
  status = 200
  force = true

# Pastikan sw.js untuk iklan tidak kena SPA redirect - serve file asli
[[redirects]]
  from = "/sw.js"
  to = "/sw.js"
  status = 200

# Robots dinamis agar Sitemap URL ikut domain (.com vs netlify.app)
[[redirects]]
  from = "/robots.txt"
  to = "/.netlify/functions/robots"
  status = 200
  force = true

# Redirect untuk SPA (semua rute ke index.html) - HARUS paling bawah
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Konfigurasi Functions
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Header CORS
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/img-proxy"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Build settings untuk Vite
[build]
  publish = "dist"
  command = "npm run build"
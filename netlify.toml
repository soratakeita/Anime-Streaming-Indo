# netlify.toml

# Redirect untuk API ke Netlify Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# Redirect untuk image proxy ke Netlify Function
[[redirects]]
  from = "/img-proxy"
  to = "/.netlify/functions/img-proxy"
  status = 200
  force = true

# Pastikan sw.js untuk iklan tidak kena SPA redirect - serve file asli
[[redirects]]
  from = "/sw.js"
  to = "/sw.js"
  status = 200

# Redirect untuk SPA (semua rute ke index.html) - HARUS paling bawah
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Konfigurasi Functions
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Header CORS
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/img-proxy"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=86400"

# Build settings untuk Vite
[build]
  publish = "dist"
  command = "npm run build"